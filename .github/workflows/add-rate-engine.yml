name: Add rate trend and asset rate scoring

on:
  push:
    paths:
      - '.github/workflows/add-rate-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch investment dashboard
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          def rep(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'patch target not found: {label}')
              text = text.replace(old, new, 1)

          # 1) Add real yield to FRED data.
          rep(
              '    "US 10Y": "DGS10",\n    "US 30Y": "DGS30",\n',
              '    "US 10Y": "DGS10",\n    "US 30Y": "DGS30",\n    "US 10Y Real Yield": "DFII10",\n',
              'FRED real yield'
          )

          # 2) Add transformed rate series.
          rep(
              'dgs2 = fred["US 2Y"]\ndgs10 = fred["US 10Y"]\ndgs30 = fred["US 30Y"]\nhy_oas = fred["HY OAS"]\n',
              'dgs2 = fred["US 2Y"]\ndgs10 = fred["US 10Y"]\ndgs30 = fred["US 30Y"]\nreal10 = fred["US 10Y Real Yield"]\nhy_oas = fred["HY OAS"]\n',
              'rate series'
          )

          # 3) Enrich macro snapshot with rate horizons.
          rep(
              '    "us10y": latest_valid(dgs10),\n    "us10y_20dago": daily_lookback(dgs10, 20),\n    "hy_oas": latest_valid(hy_oas),\n',
              '    "us2y": latest_valid(dgs2),\n    "us2y_20dago": daily_lookback(dgs2, 20),\n    "us10y": latest_valid(dgs10),\n    "us10y_20dago": daily_lookback(dgs10, 20),\n    "us10y_60dago": daily_lookback(dgs10, 60),\n    "us30y": latest_valid(dgs30),\n    "us30y_20dago": daily_lookback(dgs30, 20),\n    "real10y": latest_valid(real10),\n    "real10y_20dago": daily_lookback(real10, 20),\n    "hy_oas": latest_valid(hy_oas),\n',
              'macro rate snapshot'
          )

          # 4) Insert independent rate-condition and asset rate-fit engine.
          anchor = '\ndef macro_fit_score(asset_name, group, macro_state, macro_regime, macro_bias, m):\n'
          if anchor not in text:
              raise SystemExit('macro_fit_score anchor missing')

          rate_code = r'''
def rate_condition(m):
    """미 국채/실질금리의 최근 방향. 투자 판단용 휴리스틱이며 금리 예측이 아니다."""
    if pd.isna(m.get("us10y")) or pd.isna(m.get("us10y_20dago")):
        return "확인 필요", 0.0, np.nan, np.nan

    d10_1m = m["us10y"] - m["us10y_20dago"]
    d10_3m = m["us10y"] - m["us10y_60dago"] if pd.notna(m.get("us10y_60dago")) else np.nan
    dreal = m["real10y"] - m["real10y_20dago"] if pd.notna(m.get("real10y")) and pd.notna(m.get("real10y_20dago")) else np.nan

    if d10_1m >= 0.25 or (pd.notna(dreal) and dreal >= 0.15):
        label = "↑↑ 급등 경계"
    elif d10_1m >= 0.10:
        label = "↑ 상승"
    elif d10_1m <= -0.20 and (pd.isna(dreal) or dreal <= -0.05):
        label = "↓↓ 완화"
    elif d10_1m <= -0.10:
        label = "↓ 하락"
    else:
        label = "→ 안정"
    return label, d10_1m, d10_3m, dreal


def rate_fit_score(asset_name, group, m):
    """자산별 금리 적합도 0~15. 같은 금리 변화도 주식·채권·금에 다르게 해석한다."""
    u10, u10p = m.get("us10y"), m.get("us10y_20dago")
    u30, u30p = m.get("us30y"), m.get("us30y_20dago")
    rr, rrp = m.get("real10y"), m.get("real10y_20dago")

    d10 = u10 - u10p if pd.notna(u10) and pd.notna(u10p) else np.nan
    d30 = u30 - u30p if pd.notna(u30) and pd.notna(u30p) else np.nan
    dr = rr - rrp if pd.notna(rr) and pd.notna(rrp) else np.nan

    if group == "Equity":
        p = 8
        if pd.notna(d10):
            if d10 <= -0.20: p += 4
            elif d10 <= -0.05: p += 2
            elif d10 >= 0.25: p -= 5
            elif d10 >= 0.10: p -= 2
        # Nasdaq는 실질금리에 더 민감하게 반영.
        if asset_name == "Nasdaq 100" and pd.notna(dr):
            if dr <= -0.10: p += 3
            elif dr >= 0.15: p -= 4
        elif pd.notna(dr):
            if dr <= -0.10: p += 1
            elif dr >= 0.15: p -= 2
        return int(np.clip(p, 0, 15))

    if group == "Bond":
        # IEF는 10년, TLT는 30년 금리 방향을 더 직접적으로 반영.
        d = d30 if "Long" in asset_name else d10
        p = 7
        if pd.notna(d):
            if d <= -0.30: p += 8
            elif d <= -0.15: p += 6
            elif d <= -0.05: p += 3
            elif d >= 0.30: p -= 7
            elif d >= 0.15: p -= 5
            elif d >= 0.05: p -= 2
        return int(np.clip(p, 0, 15))

    if group == "Gold":
        # 금은 명목금리보다 실질금리 방향에 더 큰 비중.
        p = 7
        if pd.notna(dr):
            if dr <= -0.20: p += 8
            elif dr <= -0.10: p += 6
            elif dr <= -0.03: p += 3
            elif dr >= 0.20: p -= 7
            elif dr >= 0.10: p -= 5
            elif dr >= 0.03: p -= 2
        elif pd.notna(d10):
            if d10 <= -0.15: p += 4
            elif d10 >= 0.15: p -= 4
        return int(np.clip(p, 0, 15))

    return 7

'''
          text = text.replace(anchor, '\n' + rate_code + anchor.lstrip('\n'), 1)

          # 5) Replace macro-fit function: 0~20, avoiding direct rate double-counting.
          start = text.index('def macro_fit_score(asset_name, group, macro_state, macro_regime, macro_bias, m):')
          end = text.index('\n\ndef entry_decision(', start)
          new_macro = r'''def macro_fit_score(asset_name, group, macro_state, macro_regime, macro_bias, m):
    """경기·물가·고용 중심 거시 적합도 0~20. 금리는 rate_fit_score에서 별도 평가."""
    if group == "Equity":
        p = 10
        if macro_state.get("Growth") == "개선": p += 4
        elif macro_state.get("Growth") == "둔화": p -= 4
        if macro_state.get("Inflation") == "둔화": p += 3
        elif macro_state.get("Inflation") == "재가속": p -= 4
        if macro_state.get("Employment") == "견조": p += 2
        elif macro_state.get("Employment") == "빠른 악화": p -= 5
        cap = 16 if asset_name in ["KOSPI", "Nifty 50"] else 20
        return int(np.clip(p, 0, cap))

    if group == "Bond":
        p = 8
        if macro_state.get("Inflation") == "둔화": p += 6
        elif macro_state.get("Inflation") == "재가속": p -= 6
        if macro_state.get("Growth") == "둔화": p += 4
        elif macro_state.get("Growth") == "개선": p -= 2
        if macro_state.get("Employment") == "빠른 악화": p += 3
        if "경착륙" in macro_regime: p += 2
        return int(np.clip(p, 0, 20))

    if group == "Gold":
        p = 9
        if "경착륙" in macro_regime: p += 5
        if "스태그플레이션" in macro_regime: p += 6
        if macro_state.get("Inflation") == "재가속": p += 2
        return int(np.clip(p, 0, 20))

    return 10
'''
          text = text[:start] + new_macro + text[end:]

          # 6) Replace entry engine with 35/20/20/15/10 structure.
          start = text.index('def entry_decision(row, macro_state, macro_regime, macro_bias, m):')
          end = text.index('\n\ndef card_html(', start)
          new_entry = r'''def entry_decision(row, macro_state, macro_regime, macro_bias, m):
    group, asset_name = row["분류"], row["자산"]
    oversold = row.get("Oversold Score", np.nan)
    rsi = row.get("RSI14", np.nan)
    r1m = row.get("1M %", np.nan)
    trend_up = row.get("MA200 Trend") == "상승"

    # 총 100점: 가격 35 + 장기추세 20 + 경기/물가/고용 20 + 금리 15 + 눌림 10
    price_pts = int(round(oversold * 8.75)) if pd.notna(oversold) else 0
    trend_pts = 20 if trend_up else 5
    macro_pts = macro_fit_score(asset_name, group, macro_state, macro_regime, macro_bias, m)
    rate_pts = rate_fit_score(asset_name, group, m)

    if pd.isna(r1m): pullback_pts = 3
    elif -12 <= r1m <= -2: pullback_pts = 10
    elif -2 < r1m <= 1.5: pullback_pts = 7
    elif -20 <= r1m < -12: pullback_pts = 6
    elif 1.5 < r1m <= 5: pullback_pts = 3
    else: pullback_pts = 0

    score = price_pts + trend_pts + macro_pts + rate_pts + pullback_pts

    # 과열·경착륙 안전장치
    if pd.notna(rsi) and rsi >= 70:
        score = min(score, 58)
    if group == "Equity" and "경착륙" in macro_regime:
        score = min(score, 58)

    if score >= 75: action, css = "진입 우호", "action-good"
    elif score >= 60: action, css = "분할 진입", "action-mid"
    elif score >= 45: action, css = "정찰 / 대기", "action-watch"
    else: action, css = "대기", "action-wait"

    notes = []
    if pd.notna(oversold): notes.append(f"과매도 {int(oversold)}/4")
    notes.append("MA200 상승" if trend_up else "MA200 약세/미확인")
    if pd.notna(rsi): notes.append(f"RSI {rsi:.0f}")
    notes.append(f"거시 {macro_pts}/20")
    notes.append(f"금리 {rate_pts}/15")
    if asset_name == "KOSPI": notes.append("원/달러·외인수급 별도 확인")
    elif asset_name == "Nifty 50": notes.append("인도금리·루피 별도 확인")

    return {
        "Entry Score": int(score), "Action": action, "CSS": css,
        "Price Pts": price_pts, "Trend Pts": trend_pts, "Macro Pts": macro_pts,
        "Rate Pts": rate_pts, "Pullback Pts": pullback_pts,
        "Reason": " · ".join(notes),
    }
'''
          text = text[:start] + new_entry + text[end:]

          # 7) Calculate rate label after macro summary.
          rep(
              'macro_state, macro_regime, macro_bias, macro_score = make_macro_summary(m)\n',
              'macro_state, macro_regime, macro_bias, macro_score = make_macro_summary(m)\nrate_trend, rate_1m_delta, rate_3m_delta, real_rate_1m_delta = rate_condition(m)\n',
              'rate condition call'
          )

          # 8) First-screen regime: make rates visible; remove less-actionable Bias tile.
          rep(
              '    c1, c2, c3, c4, c5, c6 = st.columns(6)\n    c1.metric("거시국면", macro_regime)\n    c2.metric("전체 매수강도", buy_intensity)\n    c3.metric("중단기 Bias", macro_bias)\n    c4.metric("성장", macro_state.get("Growth", "N/A"))\n    c5.metric("물가", macro_state.get("Inflation", "N/A"))\n    c6.metric("고용", macro_state.get("Employment", "N/A"))\n',
              '    c1, c2, c3, c4, c5, c6 = st.columns(6)\n    c1.metric("거시국면", macro_regime)\n    c2.metric("전체 매수강도", buy_intensity)\n    c3.metric("성장", macro_state.get("Growth", "N/A"))\n    c4.metric("물가", macro_state.get("Inflation", "N/A"))\n    c5.metric("고용", macro_state.get("Employment", "N/A"))\n    c6.metric("금리 추이", rate_trend)\n    st.caption(f"중단기 Bias: {macro_bias} · 10Y 1개월 변화 {rate_1m_delta:+.2f}%p" if pd.notna(rate_1m_delta) else f"중단기 Bias: {macro_bias}")\n',
              'first screen rate tile'
          )

          # 9) Priority board includes independent rate fit.
          rep(
              '            "자산", "Action", "Entry Score", "Oversold Score", "RSI14", "MA200 Trend", "1M %", "Macro Pts"\n        ]].copy()\n        board.columns = ["자산", "판정", "진입점수", "과매도", "RSI", "MA200", "1개월", "거시적합"]\n',
              '            "자산", "Action", "Entry Score", "Oversold Score", "RSI14", "MA200 Trend", "1M %", "Macro Pts", "Rate Pts"\n        ]].copy()\n        board.columns = ["자산", "판정", "진입점수", "과매도", "RSI", "MA200", "1개월", "거시적합", "금리적합"]\n',
              'priority board cols'
          )
          rep(
              '                "거시적합": st.column_config.ProgressColumn("거시적합", min_value=0, max_value=25, format="%d"),\n',
              '                "거시적합": st.column_config.ProgressColumn("거시적합", min_value=0, max_value=20, format="%d"),\n                "금리적합": st.column_config.ProgressColumn("금리적합", min_value=0, max_value=15, format="%d"),\n',
              'priority board config'
          )

          # 10) Summary/caption explain rates.
          rep(
              "                <div class=\"summary-small\">성장 {macro_state.get('Growth','N/A')} · 물가 {macro_state.get('Inflation','N/A')} · 고용 {macro_state.get('Employment','N/A')} · 금융여건 {macro_state.get('Financial Conditions','N/A')}</div></div>\"\"\",\n",
              "                <div class=\"summary-small\">성장 {macro_state.get('Growth','N/A')} · 물가 {macro_state.get('Inflation','N/A')} · 고용 {macro_state.get('Employment','N/A')} · 금리 {rate_trend}</div></div>\"\"\",\n",
              'summary rate'
          )
          rep(
              '        "진입점수 = 과매도 40 + MA200 추세 20 + 자산별 거시적합도 25 + 최근 1개월 눌림 15. "\n',
              '        "진입점수 = 과매도 35 + MA200 추세 20 + 경기·물가·고용 20 + 자산별 금리조건 15 + 최근 1개월 눌림 10. "\n',
              'score caption'
          )

          # 11) Asset Details score breakdown.
          rep(
              '            f"**점수 구성:** 가격 {int(r[\'Price Pts\'])}/40 · 추세 {int(r[\'Trend Pts\'])}/20 · "\n            f"거시 {int(r[\'Macro Pts\'])}/25 · 눌림 {int(r[\'Pullback Pts\'])}/15"\n',
              '            f"**점수 구성:** 가격 {int(r[\'Price Pts\'])}/35 · 추세 {int(r[\'Trend Pts\'])}/20 · "\n            f"거시 {int(r[\'Macro Pts\'])}/20 · 금리 {int(r[\'Rate Pts\'])}/15 · 눌림 {int(r[\'Pullback Pts\'])}/10"\n',
              'asset detail breakdown'
          )

          # 12) Rate chart includes real yield.
          rep(
              '        st.plotly_chart(fig_lines({"US 2Y": dgs2, "US 10Y": dgs10, "US 30Y": dgs30},\n                                  "US Treasury Yields", "%", 504), use_container_width=True)\n',
              '        st.plotly_chart(fig_lines({"US 2Y": dgs2, "US 10Y": dgs10, "US 30Y": dgs30, "10Y Real Yield": real10},\n                                  "US Treasury & Real Yield", "%", 504), use_container_width=True)\n',
              'rate chart'
          )

          p.write_text(text, encoding='utf-8')

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/add-rate-engine.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/add-rate-engine.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Add rate trend to investment decisions"
          git push
