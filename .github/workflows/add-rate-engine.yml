name: Add rate trend and asset rate scoring

on:
  push:
    paths:
      - '.github/workflows/add-rate-engine.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch investment dashboard
        run: python .github/scripts/patch_rate_engine.py

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Remove temporary patch files and commit
        shell: bash
        run: |
          rm .github/workflows/add-rate-engine.yml
          rm .github/scripts/patch_rate_engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/add-rate-engine.yml .github/scripts/patch_rate_engine.py
          git commit -m "Add rate trend to investment decisions"
          git push
