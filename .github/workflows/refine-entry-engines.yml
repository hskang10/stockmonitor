name: Refine asset entry engines

on:
  push:
    paths:
      - '.github/workflows/refine-entry-engines.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply asset engine refactor
        run: python tools/refine_entry_engines.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit dashboard update
        shell: bash
        run: |
          rm tools/refine_entry_engines.py
          rm .github/workflows/refine-entry-engines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tools/refine_entry_engines.py .github/workflows/refine-entry-engines.yml
          git commit -m "Refine asset-specific entry engines"
          git push
