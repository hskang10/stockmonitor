name: Patch FRED secrets loading

on:
  push:
    paths:
      - '.github/workflows/patch-fred-secrets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.py and gitignore
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'''api_key = fred_key\(\)\nif not api_key:\n(?:    .*\n)+?else:\n    st\.sidebar\.success\("FRED API Key 연결됨"\)'''
          )
          replacement = '''api_key = fred_key()\nif api_key:\n    st.sidebar.success("FRED API Key 자동 연결됨")\nelse:\n    st.sidebar.error("FRED_API_KEY가 설정되지 않았습니다. Streamlit Secrets 또는 환경변수를 확인하세요.")'''

          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'FRED sidebar block patch failed: matches={count}')

          p.write_text(new_text, encoding='utf-8')

          gi = Path('.gitignore')
          existing = gi.read_text(encoding='utf-8') if gi.exists() else ''
          entries = [
              '.streamlit/secrets.toml',
              '.env',
              '__pycache__/',
              '*.pyc',
          ]
          lines = existing.splitlines()
          for entry in entries:
              if entry not in lines:
                  lines.append(entry)
          gi.write_text('\n'.join(lines).strip() + '\n', encoding='utf-8')

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-fred-secrets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .gitignore .github/workflows/patch-fred-secrets.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "Use automatic FRED secrets loading"
          git push
