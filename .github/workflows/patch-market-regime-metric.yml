name: Patch market regime metric font

on:
  push:
    paths:
      - '.github/workflows/patch-market-regime-metric.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.py metric styles
        shell: python
        run: |
          from pathlib import Path

          p = Path("app.py")
          text = p.read_text(encoding="utf-8")
          marker = '    div[data-testid="stMetric"] {border:1px solid rgba(128,128,128,.18); border-radius:12px; padding:9px 12px;}\n'
          css = '''    /* Compact metric values: long Market regime text should wrap instead of clipping. */
              div[data-testid="stMetricValue"] {
                  font-size:1.05rem !important;
                  line-height:1.22 !important;
                  white-space:normal !important;
                  overflow-wrap:anywhere !important;
                  word-break:keep-all !important;
              }
              div[data-testid="stMetricValue"] > div {
                  font-size:inherit !important;
                  line-height:inherit !important;
                  white-space:normal !important;
              }
          '''
          if 'data-testid="stMetricValue"' not in text:
              if marker not in text:
                  raise SystemExit("metric CSS marker not found")
              text = text.replace(marker, marker + css, 1)
              p.write_text(text, encoding="utf-8")

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/patch-market-regime-metric.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py .github/workflows/patch-market-regime-metric.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix market regime metric font size"
          git push
