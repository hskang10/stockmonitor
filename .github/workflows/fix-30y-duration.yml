name: Fix 30Y duration engine

on:
  push:
    paths:
      - '.github/workflows/fix-30y-duration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 30Y duration fix
        run: python tools/fix_30y_duration.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit dashboard update
        shell: bash
        run: |
          rm tools/fix_30y_duration.py
          rm .github/workflows/fix-30y-duration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tools/fix_30y_duration.py .github/workflows/fix-30y-duration.yml
          git commit -m "Use independent 30Y three-month trend"
          git push
