name: Apply visual status styling

on:
  push:
    paths:
      - '.github/workflows/apply-visual-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual status patch
        run: python tools/patch_visual_status.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit app update
        shell: bash
        run: |
          rm tools/patch_visual_status.py
          rm .github/workflows/apply-visual-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tools/patch_visual_status.py .github/workflows/apply-visual-status.yml
          git commit -m "Improve dashboard visual status colors"
          git push
