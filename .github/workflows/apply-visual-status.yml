name: Apply visual status styling

on:
  push:
    paths:
      - '.github/workflows/apply-visual-status.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair patch script quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/patch_visual_status.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace("return f'''<div class=\"status-card {tone}\"><div class=\"status-label\">{label}</div><div class=\"status-value\">{value}</div>{sub_html}</div>'''", "return f\"\"\"<div class=\\\"status-card {tone}\\\"><div class=\\\"status-label\\\">{label}</div><div class=\\\"status-value\\\">{value}</div>{sub_html}</div>\"\"\"")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply visual status patch
        run: python tools/patch_visual_status.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit app update
        shell: bash
        run: |
          rm tools/patch_visual_status.py
          rm .github/workflows/apply-visual-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tools/patch_visual_status.py .github/workflows/apply-visual-status.yml
          git commit -m "Improve dashboard visual status colors"
          git push
